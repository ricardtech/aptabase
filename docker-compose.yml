services:
  aptabase_db:
    image: postgres:18-alpine
    restart: always
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aptabase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aptabase_pw}
      POSTGRES_DB: ${POSTGRES_DB:-aptabase}
    networks:
      - aptabase-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aptabase} -d ${POSTGRES_DB:-aptabase}"]
      interval: 10s
      timeout: 5s
      retries: 5

  aptabase_events_db:
    image: clickhouse/clickhouse-server:23.8.16.16-alpine
    restart: always
    volumes:
      - events-db-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-aptabase}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-aptabase_pw}
    networks:
      - aptabase-net
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ${CLICKHOUSE_USER:-aptabase} --password ${CLICKHOUSE_PASSWORD:-aptabase_pw} --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  aptabase:
    image: alaxricard/aptabase:1.0.0
    restart: always
    ports:
      - "127.0.0.1:8190:8080"
    environment:
      BASE_URL: https://${APTABASE_HOST}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: Server=aptabase_db;Port=5432;User Id=${POSTGRES_USER:-aptabase};Password=${POSTGRES_PASSWORD:-aptabase_pw};Database=${POSTGRES_DB:-aptabase}
      CLICKHOUSE_URL: Host=aptabase_events_db;Port=8123;Username=${CLICKHOUSE_USER:-aptabase};Password=${CLICKHOUSE_PASSWORD:-aptabase_pw}
    networks:
      - aptabase-net
    depends_on:
      aptabase_db:
        condition: service_healthy
      aptabase_events_db:
        condition: service_healthy

networks:
  aptabase-net:
    driver: bridge

volumes:
  db-data:
    driver: local
  events-db-data:
    driver: local
